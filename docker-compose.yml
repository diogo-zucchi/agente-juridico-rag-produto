# Ambiente de DESENVOLVIMENTO local (reload, código montado, senha padrão).
# Em produção a API roda numa plataforma e o banco é gerenciado: ver
# "Hospedagem" no README.
# Nome, container e portas próprios: roda ao mesmo tempo que o TCC
# (banco na 5432, API na 8000).
name: agente-juridico-rag-produto

services:
  # --------------------------------------------------------
  # PostgreSQL com extensão pgvector
  # (as tabelas são criadas pela API ao iniciar)
  # --------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agente_juridico_produto_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-senha}
      POSTGRES_DB: ${POSTGRES_DB:-agente_juridico}
    ports:
      # só a própria máquina acessa o banco
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------
  # Backend FastAPI
  # --------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agente_juridico_produto_api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # dentro da rede do compose o banco é "postgres", não "localhost"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-senha}@postgres:5432/${POSTGRES_DB:-agente_juridico}
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
