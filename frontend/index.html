<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agente Jurídico RAG</title>
  <style>
    :root {
      --azul:    #1a3a5c;
      --azul2:   #2563eb;
      --cinza:   #f1f5f9;
      --borda:   #cbd5e1;
      --texto:   #1e293b;
      --verde:   #16a34a;
      --laranja: #ea580c;
      }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: var(--cinza);
      color: var(--texto);
      min-height: 100vh;
    }
    header {
      background: var(--azul);
      color: white;
      padding: 1.2rem 2rem;
      display: flex; align-items: center; gap: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.3);
    }
    header h1 { font-size: 1.3rem; font-weight: 700; }
    header span { font-size: .85rem; opacity: .75; }

    .container {
      max-width: 1100px; margin: 1.2rem auto 0; padding: 1rem;
      display: grid; grid-template-columns: 1fr 300px; gap: 1.5rem;
    }
    @media (max-width: 760px) { .container { grid-template-columns: 1fr; } }

    .card {
      background: white; border-radius: 12px; padding: 1.5rem;
      box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 1.25rem;
    }
    .card h2 { font-size: 1rem; color: var(--azul); margin-bottom: 1rem; }

    textarea, select, input[type=text] {
      width: 100%; border: 1.5px solid var(--borda); border-radius: 8px;
      padding: .6rem .7rem; font-size: .93rem; font-family: inherit;
    }
    textarea { height: 90px; resize: vertical; }
    textarea:focus, select:focus, input:focus { outline: none; border-color: var(--azul2); }
    label.lbl { display:block; font-size:.82rem; color:#475569; margin:.6rem 0 .25rem; font-weight:600; }

    .btn-row { display: flex; gap: .75rem; margin-top: .75rem; flex-wrap: wrap; }
    button {
      padding: .6rem 1.4rem; border: none; border-radius: 8px; cursor: pointer;
      font-size: .9rem; font-weight: 600; transition: opacity .2s;
    }
    button:hover { opacity: .88; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: var(--azul2); color: white; }
    .btn-outline { background: white; color: var(--azul); border: 1.5px solid var(--azul); }

    .resposta-texto {
      background: #f8fafc; border: 1px solid var(--borda); border-radius: 8px;
      padding: 1rem; white-space: pre-wrap; line-height: 1.65; font-size: .92rem;
    }
    .fonte-item {
      background: #eff6ff; border-left: 4px solid var(--azul2);
      border-radius: 0 6px 6px 0; padding: .6rem .9rem; margin-bottom: .5rem; font-size: .85rem;
    }
    .fonte-item strong { display: block; color: var(--azul); }
    .score { color: var(--verde); font-weight: 600; font-size: .78rem; }

    .ok  { color: var(--verde); }
    .err { color: var(--laranja); }
    .upload-area {
      width: 100%; border-radius: 8px; padding: 1.2rem; text-align: center;
      cursor: pointer; background: var(--cinza); display: flex;
      flex-direction: column; align-items: center; gap: .4rem;
    }
    .upload-area input { display: none; }
    #upload-status { font-size:.85rem; min-height:1.2em; margin-top:.5rem; }
    .hist-item { padding:.55rem 0; border-bottom:1px solid var(--cinza); font-size:.83rem; cursor:pointer; }
    .hist-item:hover { color: var(--azul2); }
    .hist-data { font-size:.75rem; color:#94a3b8; }
    .spinner {
      display:inline-block; width:16px; height:16px; border:2.5px solid rgba(255,255,255,.4);
      border-top-color:white; border-radius:50%; animation:spin .7s linear infinite;
      vertical-align:middle; margin-right:.4rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display:none !important; }
    .hint { font-size:.78rem; color:#94a3b8; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>Agente Jurídico Inteligente</h1>
    <span>RAG — Retrieval-Augmented Generation</span>
  </div>
</header>

<div class="container">
  <!-- ───────── CONSULTA ───────── -->
  <div>
    <div class="card">
      <h2>Consulta Jurídica</h2>
      <label class="lbl">Pergunta</label>
      <textarea id="pergunta" placeholder="Digite sua pergunta jurídica..."></textarea>

      <label class="lbl">Modelo de linguagem (LLM)</label>
      <select id="provedor">
        <option value="maritaca">Maritaca — Sabiá</option>
        <option value="openai">ChatGPT (OpenAI)</option>
      </select>

      <label class="lbl">Documento (opcional — deixe "Todos" para busca ampla)</label>
      <select id="doc-consulta"><option value="">Todos os documentos</option></select>

      <div class="btn-row">
        <button class="btn-primary" id="btn-consultar" onclick="consultar()">Consultar</button>
        <button class="btn-outline" onclick="limpar()">Limpar</button>
      </div>

      <div id="resposta-box" class="hidden">
        <h2 style="margin-top:1.25rem">Resposta</h2>
        <div id="resposta-texto" class="resposta-texto"></div>
        <h2 style="margin-top:1rem">Fontes Utilizadas</h2>
        <div id="fontes-conteudo"></div>
      </div>
    </div>

    <div class="card">
      <h2>Histórico de Consultas</h2>
      <div id="historico-lista"><p class="hint">Carregando histórico...</p></div>
    </div>
  </div>

  <!-- ───────── SIDEBAR ───────── -->
  <div>
    <div class="card">
      <h2>Indexar Documento</h2>
      <label class="upload-area" id="upload-area">
        <input type="file" id="arquivo-input" accept=".pdf,.txt,.html,.htm" onchange="atualizarNomeArquivo()" />
        <div style="font-size:2rem">📄</div>
        <p class="hint" id="upload-label">Clique ou arraste um arquivo<br><em>PDF, TXT ou HTML</em></p>
      </label>
      <input type="text" id="titulo-doc" placeholder="Título do documento" style="margin-top:.6rem" />
      <button class="btn-primary" style="width:100%;margin-top:.6rem" onclick="fazerUpload()">Indexar</button>
      <div id="upload-status"></div>
    </div>

    <div class="card">
      <h2>Status da API</h2>
      <div id="api-status" class="hint">Verificando...</div>
    </div>
  </div>
</div>

<script>
  // a página é servida pela própria API: caminhos relativos funcionam
  // tanto em localhost quanto no domínio hospedado
  const API_BASE = "/api/v1";

  // escapa texto vindo do servidor antes de inserir em innerHTML
  function esc(v){
    return String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  // token de acesso (API_TOKEN do servidor), guardado neste navegador
  function lerToken(){ try{ return localStorage.getItem("api_token") || ""; }catch{ return ""; } }
  function salvarToken(t){ try{ localStorage.setItem("api_token", t); }catch{} }

  // fetch para a API com o token; num 401 pede o token e tenta de novo uma vez
  async function api(caminho, opcoes = {}, tentouToken = false){
    const headers = { ...(opcoes.headers || {}) };
    const token = lerToken();
    if(token) headers["X-API-Key"] = token;
    const r = await fetch(API_BASE + caminho, { ...opcoes, headers });
    if(r.status === 401 && !tentouToken){
      const novo = prompt("Esta API exige um token de acesso. Informe o token:");
      if(novo){ salvarToken(novo.trim()); return api(caminho, opcoes, true); }
    }
    return r;
  }

  window.addEventListener("load", () => {
    verificarAPI(); carregarHistorico(); carregarDocumentos();
  });

  async function verificarAPI(){
    const el = document.getElementById("api-status");
    try{
      const r = await fetch("/health");
      const d = await r.json();
      el.innerHTML = d.status==="ok"
        ? '<span style="color:var(--verde)">✅ Online — Banco conectado</span>'
        : '<span style="color:var(--laranja)">⚠️ Banco desconectado</span>';
    }catch{ el.innerHTML = '<span style="color:var(--laranja)">❌ API offline</span>'; }
  }

  async function carregarDocumentos(){
    try{
      const r = await api("/documentos");
      if(!r.ok) return [];
      const docs = await r.json();
      const selConsulta = document.getElementById("doc-consulta");
      selConsulta.innerHTML = '<option value="">Todos os documentos</option>';
      const rotuloStatus = { processando:" (indexando…)", erro:" (falhou)" };
      docs.forEach(d=>{
        const pronto = d.status === "concluido";
        selConsulta.innerHTML += `<option value="${d.id}"${pronto ? "" : " disabled"}>${esc(d.titulo)}${rotuloStatus[d.status] || ""}</option>`;
      });
      return docs;
    }catch(e){ console.error("Erro ao carregar documentos", e); return []; }
  }

  /* ───── Consulta ───── */
  async function consultar(){
    const pergunta = document.getElementById("pergunta").value.trim();
    if(!pergunta){ alert("Digite uma pergunta."); return; }
    const provedor = document.getElementById("provedor").value;
    const idDoc = document.getElementById("doc-consulta").value || null;

    const btn = document.getElementById("btn-consultar");
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Consultando...';
    document.getElementById("resposta-box").classList.add("hidden");
    try{
      const r = await api("/consultar",{
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ pergunta, provedor, id_documento: idDoc? Number(idDoc):null })
      });
      const d = await r.json();
      if(!r.ok) throw new Error(d.detail || r.status);
      document.getElementById("resposta-texto").textContent = d.resposta;
      renderFontes("fontes-conteudo", d.fontes);
      document.getElementById("resposta-box").classList.remove("hidden");
      carregarHistorico();
    }catch(e){ alert("Erro ao consultar a API."); console.error(e); }
    finally{ btn.disabled=false; btn.textContent="Consultar"; }
  }

  function renderFontes(elId, fontes){
    const fc = document.getElementById(elId); fc.innerHTML="";
    if(fontes && fontes.length){
      fontes.forEach((f,i)=>{
        fc.innerHTML += `<div class="fonte-item"><strong>[${i+1}] ${esc(f.titulo)}</strong>
          ${esc(f.fonte)} &nbsp;<span class="score">score: ${Number(f.score).toFixed(3)}</span>
          <div style="margin-top:.3rem;color:#475569">${esc((f.texto_chunk||"").substring(0,120))}…</div></div>`;
      });
    } else { fc.innerHTML = '<p class="hint">Nenhuma fonte utilizada.</p>'; }
  }

  function limpar(){
    document.getElementById("pergunta").value="";
    document.getElementById("resposta-box").classList.add("hidden");
  }

  /* ───── Upload ───── */
  function atualizarNomeArquivo(){
    const input = document.getElementById("arquivo-input");
    if(input.files.length>0){
      const nome = input.files[0].name.replace(/\.[^.]+$/,"").replace(/[-_]/g," ");
      document.getElementById("upload-label").textContent = input.files[0].name;
      document.getElementById("titulo-doc").value = nome;
    }
  }
  async function fazerUpload(){
    const input = document.getElementById("arquivo-input");
    const titulo = document.getElementById("titulo-doc").value.trim();
    const status = document.getElementById("upload-status");
    if(!input.files.length){ status.innerHTML='<span class="err">Selecione um arquivo.</span>'; return; }
    if(!titulo){ status.innerHTML='<span class="err">Informe o título.</span>'; return; }
    status.textContent="Enviando…";
    const fd = new FormData();
    fd.append("arquivo", input.files[0]);
    fd.append("titulo", titulo);
    try{
      const r = await api("/ingerir",{ method:"POST", body: fd });
      const d = await r.json();
      if(r.ok){
        input.value=""; document.getElementById("titulo-doc").value="";
        document.getElementById("upload-label").innerHTML="Clique ou arraste um arquivo<br><em>PDF, TXT ou HTML</em>";
        acompanharIndexacao(d.documento_id, d.mensagem);
      } else { status.innerHTML = `<span class="err">❌ ${esc(d.detail)}</span>`; }
    }catch(e){ status.innerHTML='<span class="err">❌ Erro de conexão com a API.</span>'; }
  }

  // a indexação roda em segundo plano no servidor: consulta o status até terminar
  async function acompanharIndexacao(id, mensagem){
    const status = document.getElementById("upload-status");
    status.innerHTML = `<span class="hint">⏳ ${esc(mensagem)}</span>`;
    for(;;){
      const doc = (await carregarDocumentos()).find(d => d.id === id);
      if(!doc){ status.textContent = ""; return; }
      if(doc.status === "concluido"){
        status.innerHTML = `<span class="ok">✅ "${esc(doc.titulo)}" indexado (ID: ${doc.id})</span>`; return;
      }
      if(doc.status === "erro"){
        status.innerHTML = `<span class="err">❌ Falha ao indexar: ${esc(doc.erro)}</span>`; return;
      }
      await new Promise(ok => setTimeout(ok, 3000));
    }
  }

  /* ───── Histórico ───── */
  async function carregarHistorico(){
    const lista = document.getElementById("historico-lista");
    try{
      const r = await api("/historico?limite=15");
      if(!r.ok) throw new Error(r.status);
      const d = await r.json();
      if(!d.length){ lista.innerHTML='<p class="hint">Nenhuma consulta ainda.</p>'; return; }
      lista.innerHTML = d.map((c, i)=>`
        <div class="hist-item" data-i="${i}">
          <div>${esc(c.pergunta.substring(0,70))}${c.pergunta.length>70?"…":""}</div>
          <div class="hist-data">${new Date(c.data_hora).toLocaleString("pt-BR")}</div>
        </div>`).join("");
      // o texto vai pelo índice, não interpolado num onclick
      lista.querySelectorAll(".hist-item").forEach(el =>
        el.addEventListener("click", () => preencherPergunta(d[el.dataset.i].pergunta)));
    }catch{ lista.innerHTML='<p class="hint">Histórico indisponível.</p>'; }
  }
  function preencherPergunta(texto){
    document.getElementById("pergunta").value = texto;
    window.scrollTo({ top:0, behavior:"smooth" });
  }
</script>
</body>
</html>
